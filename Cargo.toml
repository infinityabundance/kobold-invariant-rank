[package]
name = "kobold-invariant-rank"
version = "0.1.0"
edition = "2021"
description = "The decision engine: ranks COBOL invariants by real-ecosystem occurrence x oracle-sharpness x migration-risk to prioritize which courts to build next."
authors = ["infinityabundance"]
license = "Apache-2.0"
repository = "https://github.com/infinityabundance/kobold-invariant-rank"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kobold-archaeology = { path = "../kobold-archaeology" }
kobold-atlas = { path = "../kobold-atlas" }
